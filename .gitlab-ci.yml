# Build -> registry.4zu5.at -> Coolify-Deploy auf HETZNER 1.
# Gebaut wird auf pop-os, damit HETZNER 1 nur noch ausliefert. Ablauf und
# Fallstricke: ~/Documents/GITHUB-GITLAB-TRANSFER-PLAN.md
stages: [build, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: docker:27
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Layer-Cache aus dem letzten Build ziehen. Ohne das wandert bei jedem
    # Deploy die volle Image-Groesse ueber die Heim-Upload-Leitung.
    - docker pull "$IMAGE:latest" || true
    - docker build --cache-from "$IMAGE:latest" -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: curlimages/curl:latest
  script:
    # Fehlende Variablen sonst als "curl: (3) URL rejected: No host part in
    # the URL" -- daran ist nicht zu erkennen, dass die CI/CD-Variablen fehlen.
    # Sie haengen am PROJEKT, ein neues Projekt hat sie also nicht.
    - |
      missing=""
      for v in COOLIFY_URL COOLIFY_TOKEN COOLIFY_APP_UUID; do
        eval "value=\$$v"
        [ -z "$value" ] && missing="$missing $v"
      done
      if [ -n "$missing" ]; then
        echo "Fehlende CI/CD-Variablen:$missing"
        echo "Setzen unter Settings -> CI/CD -> Variables am PROJEKT."
        exit 1
      fi
    - |
      ANTWORT=$(curl -X POST --fail --show-error --silent \
        "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
        -H "Authorization: Bearer $COOLIFY_TOKEN")
      echo "$ANTWORT"
      # Deploy-Meldung (04.11.2026, siehe 4zu5/vault docs/deploy-notify.md): nur mit
      # der notify-Marke in der Commit-Nachricht auf Coolify warten und dem Vault melden.
      case "$CI_COMMIT_MESSAGE" in *"[notify]"*) ;; *) exit 0 ;; esac
      DEP=$(echo "$ANTWORT" | grep -o '"deployment_uuid":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
      STATUS=timeout
      if [ -n "$DEP" ]; then
        for i in $(seq 1 80); do
          sleep 15
          S=$(curl --silent "$COOLIFY_URL/api/v1/deployments/$DEP" -H "Authorization: Bearer $COOLIFY_TOKEN" \
            | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
          echo "Coolify: ${S:-?}"
          case "$S" in
            finished) STATUS=success; break ;;
            failed|cancelled*) STATUS=$S; break ;;
          esac
        done
      fi
      curl --silent --show-error -X POST "$VAULT_URL/api/deploy-hook" \
        -H "Authorization: Bearer $DEPLOY_HOOK_SECRET" \
        --data-urlencode "repo=$CI_PROJECT_PATH" --data-urlencode "status=$STATUS" \
        --data-urlencode "message=$CI_COMMIT_MESSAGE" --data-urlencode "sha=$CI_COMMIT_SHA" \
        --data-urlencode "ref=$CI_COMMIT_REF_NAME" --data-urlencode "pipeline=$CI_PIPELINE_URL" \
        --data-urlencode "url=${APP_URL:-}" || echo "Meldung an den Vault fehlgeschlagen"
      [ "$STATUS" = success ]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Scheitert schon der Build, laeuft der Deploy-Job nicht — dann meldet dieser
# (nur mit der notify-Marke; siehe 4zu5/vault docs/deploy-notify.md).
deploy-meldung-fehler:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - |
      curl --silent --show-error -X POST "$VAULT_URL/api/deploy-hook" \
        -H "Authorization: Bearer $DEPLOY_HOOK_SECRET" \
        --data-urlencode "repo=$CI_PROJECT_PATH" --data-urlencode "status=failed" \
        --data-urlencode "message=$CI_COMMIT_MESSAGE" --data-urlencode "sha=$CI_COMMIT_SHA" \
        --data-urlencode "ref=$CI_COMMIT_REF_NAME" --data-urlencode "pipeline=$CI_PIPELINE_URL" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /\[notify\]/'
      when: on_failure
